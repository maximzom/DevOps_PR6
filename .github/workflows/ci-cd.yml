name: CI/CD Pipeline with Rollback

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci-test-and-build:
    name: "CI: Pytest & Build Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (pytest)
        run: |
          mkdir -p reports
          pytest tests/test_unit.py -v --junitxml=reports/pytest-unit.xml

      - name: Build Docker image tagged with commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker build -t devops-service:${SHORT_SHA} .

      - name: Upload unit test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-unit-test-report-${{ github.run_id }}
          path: reports/

  cd-deploy-and-verify:
    name: "CD: Deploy, Verify & Auto-Rollback"
    needs: ci-test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and Testinfra
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install testing dependencies
        run: |
          pip install -r requirements.txt
          mkdir -p reports

      - name: Prepare current and previous images
        run: |
          CURR_SHA=$(git rev-parse --short HEAD)
          echo "CURR_SHA=${CURR_SHA}" >> $GITHUB_ENV

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            PREV_SHA=$(git rev-parse --short HEAD~1)
            echo "PREV_SHA=${PREV_SHA}" >> $GITHUB_ENV
            echo "Збираємо попередній стабільний образ devops-service:${PREV_SHA} для резерву відкату..."
            git archive HEAD~1 | docker build -t devops-service:${PREV_SHA} -
          else
            echo "PREV_SHA=none" >> $GITHUB_ENV
          fi

          echo "Збираємо поточний образ devops-service:${CURR_SHA}..."
          docker build -t devops-service:${CURR_SHA} .

      - name: Deploy, Run Healthcheck, Testinfra & Handle Rollback
        run: |
          echo "🚀 Розгортання образу devops-service:${CURR_SHA}..."
          IMAGE_TAG=${CURR_SHA} docker compose up -d

          check_health() {
            local max_attempts=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Спроба $attempt/$max_attempts: перевірка HTTP /health (тайм-аут 3с)..."
              if curl --silent --fail --max-time 3 http://localhost:5000/health | grep -q '"healthy"'; then
                echo "Сервіс повернув статус healthy!"
                return 0
              fi
              sleep 2
              attempt=$((attempt + 1))
            done
            return 1
          }

          DEPLOY_FAILED=0

          if ! check_health; then
            echo "Помилка: /health не відповідає або повернув помилку для версії ${CURR_SHA}!"
            DEPLOY_FAILED=1
          else
            echo "🔍 Запуск інфраструктурних тестів Testinfra..."
            if ! pytest --hosts=docker://devops_service_app tests/test_infra.py -v --junitxml=reports/testinfra-current.xml; then
              echo "Помилка: інфраструктурні тести Testinfra не пройшли!"
              DEPLOY_FAILED=1
            fi
          fi

          if [ $DEPLOY_FAILED -eq 1 ]; then
            echo "Зберігаємо логи несправного контейнера..."
            docker compose logs --no-color > reports/container-failed-${CURR_SHA}.log

            if [ "${PREV_SHA}" != "none" ]; then
              echo "Запуск автоматичного відкату до попереднього образу devops-service:${PREV_SHA}..."
              IMAGE_TAG=${PREV_SHA} docker compose up -d --force-recreate

              echo "Повторна перевірка працездатності після відкату..."
              if check_health && pytest --hosts=docker://devops_service_app tests/test_infra.py -v --junitxml=reports/testinfra-rollback.xml; then
                echo "Відкат до версії ${PREV_SHA} виконано успішно! Працездатність сервісу відновлено."
              else
                echo "Критична помилка: відкат до ${PREV_SHA} також не пройшов перевірку!"
              fi
            else
              echo "Попередній образ відсутній (перший коміт), відкат неможливий."
            fi

            echo "Завершуємо етап із помилкою згідно з вимогами (невдале розгортання має залишатися червоним)."
            exit 1
          fi

      - name: Collect container logs and reports
        if: always()
        run: |
          docker compose logs --no-color > reports/container-final.log

      - name: Upload diagnostics artifacts (logs & test reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-diagnostics-${{ github.run_id }}
          path: reports/

      - name: Teardown environment
        if: always()
        run: |
          docker compose down